services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "CI=true npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  web_node_modules:
